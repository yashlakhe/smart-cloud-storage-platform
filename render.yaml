services:
  # FastAPI Web Service on Render
  - type: web
    name: smart-cloud-storage-backend
    env: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2'"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-cloud-storage-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "https://*.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_REGION
        value: "ap-southeast-2"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: "smart-cloud-storage-cp-831744285850-ap-southeast-2-an"

databases:
  - name: smart-cloud-storage-db
    region: singapore
    plan: free
    databaseName: smartcloudstorage
    user: smartcloudstorage_user

